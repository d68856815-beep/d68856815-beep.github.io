<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя визитка</title>
    <style>
        /* Яркий современный фон */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top left, #4158D0, #C850C0, #FFCC70);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Карточка с эффектом размытия (Glassmorphism) */
        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
            width: 300px;
        }

        /* Иконка вместо фото */
        .avatar-icon {
            font-size: 60px;
            background: #f0f2f5;
            width: 100px;
            height: 100px;
            line-height: 100px;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: block;
        }

        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Стильная кнопка с номером */
        .phone-btn {
            display: block;
            background: #333;
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 18px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .phone-btn:hover {
            background: #000;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .phone-btn span {
            display: block;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar-icon">👤</div>
        
        <h1>Привет!</h1>
        <p>Добро пожаловать на мой первый сайт. Для связи со мной нажми кнопку ниже:</p>
        
        <a href="tel:+996801379801" class="phone-btn">
            <span>Позвонить мне</span>
            +996 801 379 801
        </a>
    </div>

</body>
</html>
